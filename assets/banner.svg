<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    .glow-orb-1 {
      animation: floatOrb1 10s ease-in-out infinite alternate;
    }
    .glow-orb-2 {
      animation: floatOrb2 12s ease-in-out infinite alternate;
    }
    .code-pulse {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    .particle {
      animation: floatParticle 6s ease-in-out infinite;
    }
    .dash-flow {
      stroke-dasharray: 8, 8;
      animation: flowLine 20s linear infinite;
    }
    .pill-bounce {
      animation: pillFloat 4s ease-in-out infinite alternate;
    }
    
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-50px, -30px) scale(1.2); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; }
      100% { opacity: 0.7; }
    }
    @keyframes flowLine {
      to { stroke-dashoffset: -320; }
    }
    @keyframes pillFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Animated Background Glowing Orbs -->
  <g class="glow-orb-1">
    <circle cx="200" cy="120" r="160" fill="url(#accentGlow)" filter="url(#glow)" />
  </g>
  <g class="glow-orb-2">
    <circle cx="1000" cy="300" r="180" fill="#818cf8" fill-opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- Circuit / Flow Paths in Background (Dynamic Lines) -->
  <g class="dash-flow" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <path d="M 50 80 Q 250 40 450 100 T 850 70 T 1150 120" />
    <path d="M 50 360 Q 300 390 600 340 T 1150 350" />
    <path d="M 920 60 L 1050 160 L 980 280 L 1100 370" />
    <path d="M 120 100 L 80 220 L 180 340" />
  </g>

  <!-- Graphic Elements: Server / Database Node Visualizations on Sides -->
  <!-- Left Side: Database Cylinders Graphic -->
  <g transform="translate(70, 160)" opacity="0.85">
    <!-- Cylinder 1 -->
    <path d="M 0 30 C 0 10 70 10 70 30 L 70 80 C 70 100 0 100 0 80 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <ellipse cx="35" cy="30" rx="35" ry="15" fill="#334155" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Cylinder 2 -->
    <path d="M 0 60 C 0 75 70 75 70 60" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />
    <path d="M 0 85 C 0 100 70 100 70 85 L 70 115 C 70 130 0 130 0 115 Z" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <ellipse cx="35" cy="85" rx="35" ry="15" fill="#334155" stroke="#818cf8" stroke-width="1.5" />
  </g>

  <!-- Right Side: Stored Procedure Code Node Card -->
  <g transform="translate(980, 140)" filter="url(#cardShadow)" opacity="0.9">
    <rect width="160" height="150" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <circle cx="18" cy="18" r="4" fill="#ef4444" />
    <circle cx="32" cy="18" r="4" fill="#f59e0b" />
    <circle cx="46" cy="18" r="4" fill="#10b981" />
    <line x1="12" y1="32" x2="148" y2="32" stroke="#334155" stroke-width="1" />
    <rect x="16" y="44" width="70" height="7" rx="3.5" fill="#38bdf8" class="code-pulse" />
    <rect x="16" y="58" width="110" height="6" rx="3" fill="#64748b" />
    <rect x="26" y="70" width="85" height="6" rx="3" fill="#818cf8" />
    <rect x="26" y="82" width="65" height="6" rx="3" fill="#c084fc" />
    <rect x="16" y="94" width="50" height="6" rx="3" fill="#64748b" />
    <rect x="16" y="112" width="125" height="18" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
    <text x="78" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#38bdf8" font-weight="600" text-anchor="middle">EXEC sp_execute;</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Title, Badges, Tagline (Always high contrast and crisp) -->
  <g id="foreground-content">
    <!-- Top Category Pill -->
    <g transform="translate(600, 75)" text-anchor="middle" class="pill-bounce">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="-116" cy="0" r="5" fill="#10b981" />
      <text x="8" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="1.5">CURATED AWESOME LIST</text>
    </g>

    <!-- Main Repository Title -->
    <text x="600" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="-0.5">
      <tspan fill="#ffffff">Awesome </tspan>
      <tspan fill="url(#primaryGrad)">Stored Procedures</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.2">
      High-Performance Procedural SQL, Server-Side Logic &amp; Enterprise Database Engines
    </text>

    <!-- Feature Pills (Procedural Languages) -->
    <g transform="translate(600, 250)">
      <!-- Pill 1: PL/pgSQL -->
      <g transform="translate(-255, 0)">
        <rect x="0" y="0" width="115" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
        <text x="57" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ PL/pgSQL</text>
      </g>
      <!-- Pill 2: PL/SQL -->
      <g transform="translate(-125, 0)">
        <rect x="0" y="0" width="115" height="34" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
        <text x="57" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="middle">🏛️ PL/SQL</text>
      </g>
      <!-- Pill 3: T-SQL -->
      <g transform="translate(5, 0)">
        <rect x="0" y="0" width="115" height="34" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
        <text x="57" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#818cf8" text-anchor="middle">💎 T-SQL</text>
      </g>
      <!-- Pill 4: SQL/PSM -->
      <g transform="translate(135, 0)">
        <rect x="0" y="0" width="120" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
        <text x="60" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#10b981" text-anchor="middle">📜 SQL/PSM</text>
      </g>
    </g>

    <!-- Bottom Stat Bar / Meta Info -->
    <g transform="translate(600, 340)" text-anchor="middle">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
        Open Source Engines <tspan fill="#38bdf8">•</tspan> Managed Cloud Platforms <tspan fill="#38bdf8">•</tspan> Performance Benchmarks <tspan fill="#38bdf8">•</tspan> Architecture Guides
      </text>
    </g>
  </g>
</svg>
